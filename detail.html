<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ডিটেইলস | Creator Rivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<div class="toast" id="toast"></div>

<header>
  <nav>
    <div class="logo">Creator <span>Rivo</span></div>
    <div class="nav-links">
      <a href="all-courses.html">কোর্স</a>
      <a href="all-products.html">প্রোডাক্ট</a>
      <a href="index.html#how">কীভাবে কাজ করে</a>
      <a href="index.html#reviews">রিভিউ</a>
    </div>
    <a class="wallet-chip" id="headerWalletChip" href="wallet.html" aria-label="ওয়ালেট ব্যালেন্স">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3"/><path d="M3 7v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-4"/><path d="M16 12h4v4h-4a2 2 0 0 1 0-4Z"/></svg>
      <span id="headerWalletBalance">৳0</span>
    </a>
    <a class="cart-btn" id="cartBtn" href="orders.html" aria-label="অর্ডার">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12.5a1 1 0 0 1-1 1.5H6a1 1 0 0 1-1-1.5L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="cart-badge" id="cartBadge">0</span>
    </a>
    <a class="cart-btn" id="headerNoticeBtn" href="notice.html" aria-label="নোটিফিকেশন">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.5 21a1.7 1.7 0 0 0 3 0"/></svg>
      <span class="cart-badge" id="headerNoticeBadge">0</span>
    </a>
    <a class="avatar-btn" id="avatarBtn" href="login.html" aria-label="প্রোফাইল"></a>
  </nav>
</header>

<div id="announcementBanner" class="announcement-banner" style="display:none;">
  <div class="announcement-text">
    <strong id="annBannerTitle"></strong>
    <span id="annBannerMessage"></span>
  </div>
  <button type="button" id="announcementDismiss" aria-label="বন্ধ করুন">✕</button>
</div>

<main class="page-content">
<div class="wrap" style="max-width:720px; padding:0 16px 100px; text-align:left;">
    <div id="detailCard">
    <div id="detailVideoWrap" style="display:none; margin-bottom:20px;">
      <div style="position:relative; padding-top:56.25%; border-radius:16px; overflow:hidden; background:#000;">
        <iframe id="detailVideoFrame" style="position:absolute; inset:0; width:100%; height:100%; border:0;" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
    <div id="detailImageWrap" style="display:none; margin-bottom:20px;">
      <div id="detailImage" style="aspect-ratio:4/3; border-radius:16px; background-size:cover; background-position:center;"></div>
    </div>
    <div id="detailLockedWrap" style="display:none; margin-bottom:20px;">
      <div style="aspect-ratio:16/9; border-radius:16px; background:#161320; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#fff; text-align:center; padding:20px;">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <p style="font-weight:700;">এই ভিডিও দেখতে আগে কিনুন</p>
      </div>
    </div>

    <h1 id="detailTitle" style="font-size:1.5rem; margin-bottom:12px; line-height:1.3;"></h1>
    <div id="detailTags" style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;"></div>
    <p id="detailDesc" style="color:var(--muted); line-height:1.75; margin-bottom:22px; white-space:pre-line;"></p>
    <div id="detailFeatures" style="margin-bottom:24px; display:flex; flex-direction:column; gap:10px;"></div>
    <div id="detailBadges" class="pz-badges" style="display:none;"></div>

    <div class="detail-price-row" id="detailPriceRow">
      <span id="detailPriceNow" style="font-size:1.7rem; font-weight:800; color:var(--coral);"></span>
      <span id="detailPriceSub">
        <span id="detailPriceOld" style="color:var(--muted); text-decoration:line-through; font-size:1.15rem;"></span>
        <span id="detailDiscountBadge" style="background:var(--coral); color:#fff; font-size:0.78rem; font-weight:800; padding:5px 11px; border-radius:6px; display:none;"></span>
      </span>
    </div>

    <div class="pz-delivery" id="deliveryCard" style="display:none;">
      <h3>Delivery details</h3>
      <p class="pz-est" id="deliveryEstimate"></p>
      <div class="pz-field">
        <label for="delCountry">Country <i>*</i></label>
        <select id="delCountry"></select>
      </div>
      <div class="pz-field">
        <label for="delPhone">Contact Number <i>*</i></label>
        <input type="tel" id="delPhone" inputmode="numeric" autocomplete="tel" placeholder="01XXXXXXXXX" maxlength="16">
      </div>
      <div class="pz-field" style="margin-bottom:0;">
        <label for="delAddress">Delivery Address <i>*</i></label>
        <textarea id="delAddress" autocomplete="street-address" placeholder="Full delivery address"></textarea>
      </div>
      <p class="pz-err" id="deliveryError"></p>
    </div>

    <button class="btn-buynow" id="detailBuyNowBtn" style="display:none; border:none; cursor:pointer; width:100%; padding:16px; font-size:1.02rem; margin-bottom:12px;"></button>
    <button class="btn-primary" id="detailBuyBtn" style="display:none; border:none; cursor:pointer; width:100%; padding:16px; font-size:1.02rem;"></button>
    <button type="button" class="wa-btn" id="detailWhatsappBtn" style="display:none;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
      <span id="detailWhatsappLabel"></span>
    </button>
    </div><!-- /detailCard -->

    <div class="bar-head" style="margin-top:44px;">
      <div class="left"><div class="bar"></div><h2 id="detailMoreHeading">আরও <em id="detailMoreLabel">কোর্স</em></h2></div>
      <a id="detailViewAll" href="all-products.html" style="display:none;">View All</a>
    </div>
    <div class="course-row" id="detailRelated"></div>
  </div>
</main>

<div class="modal-overlay" id="checkoutOverlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <span class="modal-eyebrow">CHECKOUT</span>
        <h3 id="checkoutModalTitle">পেমেন্ট মেথড বেছে নিন</h3>
      </div>
      <button type="button" id="checkoutCloseBtn" class="modal-close" aria-label="বন্ধ করুন">✕</button>
    </div>

    <div id="checkoutStepMethod">
      <div class="order-summary-box">
        <span>অর্ডার সামারি</span>
        <div class="order-summary-row"><span id="checkoutItemsLabel"></span><strong id="checkoutTotalLabel"></strong></div>
      </div>

      <p class="pm-section-label">পেমেন্ট মেথড বেছে নিন</p>
      <div class="pm-list" id="pmList">
        <button type="button" class="pm-row" data-method="bKash">
          <span class="pm-icon" style="background:#fff; padding:7px; border:1px solid var(--line);">
            <img src="https://i.ibb.co.com/SYN6dMH/20251113-202452.png" alt="bKash" style="width:100%; height:100%; object-fit:contain;">
          </span>
          <span class="pm-info"><strong>bKash</strong><span>মোবাইল ব্যাংকিং · ম্যানুয়াল ভেরিফিকেশন</span></span>
          <span class="pm-chev"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </button>
        <button type="button" class="pm-row" data-method="Nagad">
          <span class="pm-icon" style="background:#fff; padding:7px; border:1px solid var(--line);">
            <img src="https://i.ibb.co.com/Vp3x5kxg/1000022762-removebg-preview.png" alt="Nagad" style="width:100%; height:100%; object-fit:contain;">
          </span>
          <span class="pm-info"><strong>Nagad</strong><span>মোবাইল ব্যাংকিং · ম্যানুয়াল ভেরিফিকেশন</span></span>
          <span class="pm-chev"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </button>
        <button type="button" class="pm-row" data-method="Rocket">
          <span class="pm-icon" style="background:#fff; padding:5px; border:1px solid var(--line); overflow:hidden;">
            <img src="https://i.ibb.co.com/r270jkYV/d6621b10013ac98c8b3b3bc7a03fbf6580b5be6ab5e35898b6a7942177963e90-200.jpg" alt="Rocket" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
          </span>
          <span class="pm-info"><strong>Rocket</strong><span>মোবাইল ব্যাংকিং · ম্যানুয়াল ভেরিফিকেশন</span></span>
          <span class="pm-chev"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </button>
        <button type="button" class="pm-row" data-method="Wallet">
          <span class="pm-icon" style="background:rgba(255,59,48,0.12); color:var(--coral);">
            <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
          </span>
          <span class="pm-info"><strong>ওয়ালেট</strong><span id="pmWalletBalance">ব্যালেন্স: ৳0</span></span>
          <span class="pm-chev"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </button>
      </div>

      <label class="pm-terms">
        <input type="checkbox" id="checkoutTerms">
        <span>আমি <a href="support.html" target="_blank">শর্তাবলী</a>, <a href="support.html" target="_blank">প্রাইভেসি পলিসি</a> ও <a href="support.html" target="_blank">রিটার্ন পলিসি</a> পড়েছি এবং সম্মত আছি।</span>
      </label>

      <button type="button" class="btn-primary" id="checkoutContinueBtn" style="width:100%; border:none; cursor:pointer; opacity:0.5;" disabled>এগিয়ে যান</button>
      <div class="form-msg" id="checkoutStepMsg"></div>
    </div>

    <div id="checkoutStepManual" style="display:none;">
      <button type="button" id="checkoutBackBtn" class="pm-back">← পেমেন্ট মেথড বদলান</button>
      <div class="manual-pay-box">
        <p id="manualPayInstruction"></p>
        <div class="manual-pay-number-row">
          <span class="manual-pay-number" id="manualPayNumber"></span>
          <button type="button" class="manual-pay-copy-btn" id="manualPayCopyBtn" aria-label="নম্বর কপি করুন" title="কপি করুন">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          </button>
        </div>
      </div>
      <div class="form-field"><label>ট্রানজেকশন আইডি</label><input type="text" id="manualTxnId" required placeholder="যেমন: 8N7A2K9X1Q"></div>
      <button type="button" class="btn-primary" id="manualSubmitBtn" style="width:100%; border:none; cursor:pointer;">অর্ডার কনফার্ম করুন</button>
      <div class="form-msg" id="manualPayMsg"></div>
    </div>
  </div>
</div>

</body>
</html>
