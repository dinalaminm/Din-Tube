<section class="page" id="page-detail">
  <div class="wrap" style="max-width:720px; padding:0 16px 100px; text-align:left;">
    <div id="detailVideoWrap" style="display:none; margin-bottom:20px;">
      <div style="position:relative; padding-top:56.25%; border-radius:16px; overflow:hidden; background:#000;">
        <iframe id="detailVideoFrame" style="position:absolute; inset:0; width:100%; height:100%; border:0;" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
    <div id="detailImageWrap" style="display:none; margin-bottom:20px;">
      <div id="detailImage" style="aspect-ratio:4/3; border-radius:16px; background-size:cover; background-position:center;"></div>
    </div>
    <div id="detailLockedWrap" style="display:none; margin-bottom:20px;">
      <div style="aspect-ratio:16/9; border-radius:16px; background:#161320; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#fff; text-align:center; padding:20px;">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <p style="font-weight:700;">এই ভিডিও দেখতে আগে কিনুন</p>
      </div>
    </div>

    <h1 id="detailTitle" style="font-size:1.5rem; margin-bottom:12px; line-height:1.3;"></h1>
    <div id="detailTags" style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;"></div>
    <p id="detailDesc" style="color:var(--muted); line-height:1.75; margin-bottom:22px; white-space:pre-line;"></p>
    <div id="detailFeatures" style="margin-bottom:24px; display:flex; flex-direction:column; gap:10px;"></div>

    <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;">
      <span id="detailPriceNow" style="font-size:1.7rem; font-weight:800; color:var(--coral);"></span>
      <span id="detailPriceOld" style="color:var(--muted); text-decoration:line-through; font-size:1.15rem;"></span>
      <span id="detailDiscountBadge" style="background:var(--coral); color:#fff; font-size:0.78rem; font-weight:800; padding:5px 11px; border-radius:6px; display:none;"></span>
    </div>
    <button class="btn-primary" id="detailBuyBtn" style="border:none; cursor:pointer; width:100%; padding:16px; font-size:1.02rem;"></button>

    <div class="bar-head" style="margin-top:44px;">
      <div class="left"><div class="bar"></div><h2>আরও <em id="detailMoreLabel">কোর্স</em></h2></div>
    </div>
    <div class="course-row" id="detailRelated"></div>
  </div>
</section>
