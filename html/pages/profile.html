<section class="page" id="page-profile">
  <div class="simple-page">
    <div id="profileLoggedOut">
      <h1>প্রোফাইল</h1>
      <p>প্রোফাইল দেখতে প্রথমে লগ ইন করুন।</p>
      <button class="btn-primary" id="goLoginBtn" style="border:none; cursor:pointer;">লগ ইন করুন</button>
    </div>
    <div id="profileLoggedIn" style="display:none; text-align:left;">
      <div class="profile-card">
        <div class="profile-avatar" id="profileAvatar"></div>
        <div>
          <h3 id="profileName" style="font-size:1.2rem;">ইউজার</h3>
          <span style="color:var(--muted); font-size:0.9rem;" id="profileHandle"></span>
          <div style="color:var(--muted); font-size:0.78rem; margin-top:4px;">যোগদান: <span id="profileJoined">—</span></div>
        </div>
      </div>

      <div class="dash-grid">
        <div class="dash-card" data-nav="wallet">
          <span class="dash-icon">👛</span>
          <span>ওয়ালেট: <strong id="dashWalletBalance">৳0</strong></span>
        </div>
        <div class="dash-card" data-nav="settings">
          <span class="dash-icon">⚙️</span>
          <span>প্রোফাইল সেটিংস</span>
        </div>
        <div class="dash-card" data-nav="support">
          <span class="dash-icon">🎫</span>
          <span>আমার সাপোর্ট টিকিট</span>
        </div>
        <div class="dash-card" data-nav="notice">
          <span class="dash-badge" id="dashNoticeBadge"></span>
          <span class="dash-icon">🔔</span>
          <span>নোটিফিকেশন</span>
        </div>
        <div class="dash-card" data-nav="orders">
          <span class="dash-icon">🧾</span>
          <span>আমার অর্ডার</span>
        </div>
        <div class="dash-card" data-nav="mydownloads">
          <span class="dash-icon">⬇️</span>
          <span>আমার ডাউনলোড</span>
        </div>
      </div>

      <button class="btn-ghost" id="logoutBtn" style="cursor:pointer; width:100%; text-align:center; margin-top:22px;">লগ আউট করুন</button>
    </div>
  </div>
</section>
