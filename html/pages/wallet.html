<section class="page" id="page-wallet">
  <div class="simple-page" style="text-align:left;">
    <h1>ওয়ালেট</h1>
    <div class="wallet-balance-card">
      <span>বর্তমান ব্যালেন্স</span>
      <strong id="walletBalanceDisplay">৳0</strong>
    </div>

    <h3 style="font-size:1.05rem; margin:26px 0 12px;">ডিপোজিট করুন</h3>
    <p style="color:var(--muted); font-size:0.85rem; margin-bottom:14px;">
      bKash/Nagad/Rocket-এ টাকা পাঠিয়ে নিচে ট্রানজেকশন আইডি দিন। অ্যাডমিন যাচাই করে ব্যালেন্স যোগ করে দেবে।
    </p>
    <form id="depositForm" style="max-width:420px;">
      <div class="form-field"><label>পরিমাণ (৳)</label><input type="number" id="depAmount" required min="1" placeholder="৫০০"></div>
      <div class="form-field">
        <label>পেমেন্ট মেথড</label>
        <select id="depMethod" style="width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line); font-family:inherit; font-size:0.95rem;">
          <option value="bKash">bKash</option>
          <option value="Nagad">Nagad</option>
          <option value="Rocket">Rocket</option>
          <option value="Bank">ব্যাংক ট্রান্সফার</option>
          <option value="Other">অন্যান্য</option>
        </select>
      </div>
      <div class="form-field"><label>ট্রানজেকশন আইডি</label><input type="text" id="depTxnId" required placeholder="যেমন: 8N7A2K9X1Q"></div>
      <div class="form-field"><label>নোট (ঐচ্ছিক)</label><input type="text" id="depNote" placeholder="অতিরিক্ত তথ্য"></div>
      <button type="submit" class="btn-primary" style="width:100%; border:none; cursor:pointer;">ডিপোজিট রিকোয়েস্ট পাঠান</button>
      <div class="form-msg" id="depositMsg"></div>
    </form>

    <h3 style="font-size:1.05rem; margin:30px 0 12px;">লেনদেনের ইতিহাস</h3>
    <div id="walletTxnList"><p style="color:var(--muted);">লোড হচ্ছে...</p></div>
  </div>
</section>
