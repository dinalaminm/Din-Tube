<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Creator Rivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div class="toast" id="toast"></div>

<header>
  <nav>
    <div class="logo">Creator <span>Rivo</span></div>
    <div class="nav-links">
      <a href="all-courses.html">Courses</a>
      <a href="all-products.html">Products</a>
      <a href="index.html#how">How It Works</a>
      <a href="index.html#reviews">Reviews</a>
    </div>
    <a class="wallet-chip" id="headerWalletChip" href="wallet.html" aria-label="Wallet Balance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3"/><path d="M3 7v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-4"/><path d="M16 12h4v4h-4a2 2 0 0 1 0-4Z"/></svg>
      <span id="headerWalletBalance">Tk0</span>
    </a>
    <a class="cart-btn" id="cartBtn" href="orders.html" aria-label="Orders">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12.5a1 1 0 0 1-1 1.5H6a1 1 0 0 1-1-1.5L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="cart-badge" id="cartBadge">0</span>
    </a>
    <a class="cart-btn" id="headerNoticeBtn" href="notice.html" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.5 21a1.7 1.7 0 0 0 3 0"/></svg>
      <span class="cart-badge" id="headerNoticeBadge">0</span>
    </a>
    <a class="avatar-btn" id="avatarBtn" href="login.html" aria-label="Profile"></a>
  </nav>
</header>

<div id="announcementBanner" class="announcement-banner" style="display:none;">
  <div class="announcement-text">
    <strong id="annBannerTitle"></strong>
    <span id="annBannerMessage"></span>
  </div>
  <button type="button" id="announcementDismiss" aria-label="Close">✕</button>
</div>

<main class="page-content">
<div class="simple-page">
    <h1 id="authTitle">Log In</h1>
    <p id="authSubtitle">Log in to your account to track orders and get exclusive offers.</p>
    <div class="auth-tabs" id="authTabsWrap">
      <button type="button" class="auth-tab active" data-authtab="login">Log In</button>
      <button type="button" class="auth-tab" data-authtab="register">Register</button>
    </div>

    <div id="googleAuthBlock" style="max-width:360px; margin:0 auto;">
      <button type="button" id="googleSignInBtn" style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--text); font-weight:700; font-size:0.9rem; cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-4z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 15.6 3 8.3 7.8 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 36.1 26.7 37 24 37c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.1 40.4 15.9 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C40.9 36.3 44 30.7 44 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <div id="googleSignInMsg" class="form-msg"></div>
      <div style="display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--muted); font-size:0.8rem;">
        <span style="flex:1; height:1px; background:var(--line);"></span>
        or
        <span style="flex:1; height:1px; background:var(--line);"></span>
      </div>
    </div>

    <form id="loginForm" style="text-align:left; max-width:360px; margin:0 auto;">
      <div class="form-field"><label>Email</label><input type="email" id="loginId" required placeholder="you@example.com"></div>
      <div class="form-field"><label>Password</label><input type="password" id="loginPass" required placeholder="••••••••"></div>
      <button type="submit" class="btn-primary" style="width:100%; border:none; cursor:pointer;">Log In</button>
      <a href="#" id="forgotPassLink" style="display:block; text-align:center; margin-top:12px; font-size:0.85rem; color:var(--muted);">Forgot Password?</a>
      <div class="form-msg" id="loginMsg"></div>
    </form>

    <div id="forgotPasswordPanel" style="display:none; text-align:left; max-width:360px; margin:0 auto;">
      <p style="color:var(--muted); font-size:0.85rem; margin-bottom:16px; line-height:1.6;">Enter the email you used to create your account — we'll send a password reset link.</p>
      <form id="forgotPasswordForm">
        <div class="form-field"><label>Email</label><input type="email" id="forgotEmail" required placeholder="you@example.com"></div>
        <button type="submit" id="forgotSubmitBtn" class="btn-primary" style="width:100%; border:none; cursor:pointer;">Send Reset Link</button>
        <a href="#" id="backToLoginLink" style="display:block; text-align:center; margin-top:12px; font-size:0.85rem; color:var(--muted);">Back to Login</a>
        <div class="form-msg" id="forgotPassMsg"></div>
      </form>
    </div>

    <form id="registerForm" style="display:none; text-align:left; max-width:360px; margin:0 auto;">
      <div class="form-field"><label>Name</label><input type="text" id="regName" required></div>
      <div class="form-field"><label>Phone Number</label><input type="text" id="regPhone" required placeholder="017XXXXXXXX"></div>
      <div class="form-field"><label>Email</label><input type="email" id="regEmail" required></div>
      <div class="form-field"><label>Password</label><input type="password" id="regPass" required placeholder="At least 6 characters"></div>
      <button type="submit" class="btn-primary" style="width:100%; border:none; cursor:pointer;">Create Account</button>
      <div class="form-msg" id="registerMsg"></div>
    </form>
  </div>
</main>



<script type="module" src="js/pages/login.js"></script>

  <a data-tab="product" href="all-products.html"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12.5a1 1 0 0 1-1 1.5H6a1 1 0 0 1-1-1.5L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>Products</a>
  <a data-tab="download" href="download.html"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16a4.5 4.5 0 0 1-1-8.9 5.5 5.5 0 0 1 10.7-2A4.5 4.5 0 0 1 17.5 16"/><path d="M12 11v8m0 0-3-3m3 3 3-3"/></svg></span>Download</a>
  <a data-tab="profile" href="profile.html"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></span>Profile</a>
</nav>

</body>
</html>
