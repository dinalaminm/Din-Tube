<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>গেম | Creator Rivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
<style>
  html, body{height:100%; margin:0; overflow:hidden;}
  #pgContent{height:100%;}
  .pg-bar{
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0));
    box-sizing:border-box; pointer-events:none;
  }
  .pg-bar > *{pointer-events:auto;}
  .pg-back{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(20,18,30,0.55); color:#fff; flex-shrink:0; text-decoration:none;
  }
  .pg-title{font-weight:800; font-size:0.9rem; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.5); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1;}
  .pg-expiry{font-size:0.68rem; color:rgba(255,255,255,0.85); text-shadow:0 1px 4px rgba(0,0,0,0.5); white-space:nowrap; flex-shrink:0;}
  .pg-fullscreen-btn{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(20,18,30,0.55); color:#fff; border:none; cursor:pointer; flex-shrink:0;
  }
  .pg-frame-wrap{position:relative; width:100%; height:100%; background:#000;}
  .pg-frame-wrap iframe{width:100%; height:100%; border:0; display:block;}
  .pg-gate{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px 24px; gap:14px; box-sizing:border-box;
  }
  .pg-gate svg{width:52px; height:52px; opacity:0.3;}
  .pg-gate h2{font-size:1.1rem; margin:0;}
  .pg-gate p{color:var(--muted); font-size:0.88rem; max-width:280px; margin:0;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="pg-bar">
  <a href="games.html" class="pg-back" aria-label="ফিরে যান">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </a>
  <span class="pg-title" id="pgTitle">লোড হচ্ছে...</span>
  <span class="pg-expiry" id="pgExpiry"></span>
  <button type="button" class="pg-fullscreen-btn" id="pgFullscreenBtn" aria-label="ফুলস্ক্রিন">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </button>
</div>

<div id="pgContent"></div>

<script type="module" src="js/pages/play-game.js"></script>
</body>
</html>
